[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pantry-planner"
version = "0.1.0"
description = "LLM-driven grocery matcher with model-router — demo project"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "anthropic>=0.40.0",
    "burr[start]>=0.30.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.30",
    # Postgres driver — used when DB_URL/DB_HOST point at Postgres
    # (the GitOps/Kubernetes deployment); SQLite needs nothing extra.
    "psycopg[binary]>=3.2",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    # MCP server (stdio via the pantry-mcp script; HTTP mounted in api.py)
    "mcp>=1.10.0",
    # Pin: Burr's tracking UI ships templates that break on Jinja2 3.1.5+
    # (cache-key change makes template lookup raise TypeError). Revisit
    # once Burr updates its templating layer.
    "jinja2==3.1.4",
    # /metrics — exports the cost/latency the pipeline already computes
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
pantry-mcp = "pantry_planner.mcp_server:main"

[tool.setuptools.packages.find]
include = ["pantry_planner*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.coverage.run]
# Branch coverage, not just line: the review that prompted this found real
# bugs only a branch gate surfaces. Gate starts at today's measured number
# and ratchets — a threshold nobody can pass is a threshold everyone
# disables.
branch = true
source = ["pantry_planner"]
omit = ["*/demo.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Set just under today's measured 86% so ordinary churn doesn't flap the
# build. Raise it as coverage rises; never lower it to make a branch pass.
fail_under = 85

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
