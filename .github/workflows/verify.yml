# ============================================================
# pantry-api — pull-request verification
#
# build-and-deploy only runs on push to main, so a branch could merge
# without its tests ever running against the merge result.
#
# Two jobs, deliberately:
#   test      — the suite on SQLite, with a branch-coverage gate
#   postgres  — the same suite against the engine production uses
#
# The second exists because an `IN ()` clause parses on SQLite and is a
# syntax error on Postgres. That bug shipped and was invisible for exactly
# as long as the suite ran on one backend only.
# ============================================================

name: verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # The suite mocks every LLM call and touches no network, so it needs
      # no ANTHROPIC_API_KEY. Branch coverage is gated in pyproject.
      - run: pytest -q --cov --cov-report=term-missing

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pantry
          POSTGRES_PASSWORD: pantry
          POSTGRES_DB: pantry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pantry"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Same suite, production's engine. Dialect differences that SQLite
      # forgives (IN (), stricter GROUP BY, type coercion) fail here.
      #
      # The test modules read PANTRY_TEST_DB_URL — not DB_URL — because each
      # module sets DB_URL itself. The first version of this job exported
      # DB_URL only, so every module silently fell back to SQLite and the
      # job proved nothing. Hence the self-check step below.
      PANTRY_TEST_DB_URL: postgresql+psycopg://pantry:pantry@127.0.0.1:5432/pantry
      PGPASSWORD: pantry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -p no:randomly
      - name: Prove the suite actually ran against Postgres
        # A hollow run leaves these tables absent or empty. Fail loudly
        # rather than let a green check stand for a backend never touched.
        run: |
          n=$(psql -h 127.0.0.1 -U pantry -d pantry -tAc "select count(*) from products")
          echo "products rows in Postgres after the suite: $n"
          test "$n" -gt 0 || { echo "::error::suite did not touch Postgres"; exit 1; }
          psql -h 127.0.0.1 -U pantry -d pantry -tAc \
            "select to_regclass('product_origin_evidence') is not null" | grep -q t
